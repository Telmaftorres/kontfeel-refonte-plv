.grow{flex:1}

.canvaswrap{flex:1;display:flex;justify-content:center;padding:14px;min-height:0;overflow:auto}
#canvas{width:100%;height:100%;border:0;background:#fff;box-shadow:0 2px 18px #0002;border-radius:4px;transition:width .25s;flex:none}
.only-m{display:none}

.grip{cursor:grab;color:#aaa;display:grid;place-items:center;width:16px}

.ib{border:0;background:none;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:#555;padding:0;flex:none}.ib:hover{background:var(--uib);color:var(--ui)}

.tile{border:1px solid var(--uil);background:#fff;border-radius:8px;padding:6px 6px 7px;display:flex;flex-direction:column;gap:5px;align-items:stretch;text-align:center;font-size:12px}

.linkbtn{border:0;background:none;color:var(--acc);padding:0;margin:0 0 14px;text-decoration:underline}
.grp{font-weight:650;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#444;margin:16px 0 7px}.grp:first-child{margin-top:0}
.addgrid{display:grid;grid-template-columns:1fr;gap:6px}

.insnote{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--accp);color:var(--acc);border-radius:8px;padding:8px 10px;margin-bottom:12px;font-weight:550}.insnote button{border:0;background:none;color:var(--acc);text-decoration:underline;padding:0}
.presets{display:grid;gap:6px}.preset{text-align:left;border:1px solid var(--uil);background:#fff;border-radius:8px;padding:9px 11px}.preset:hover{border-color:var(--acc);background:var(--accp)}.preset b{display:block}.preset small{color:var(--uim)}

.danger-link{border:1px solid var(--uil);background:#fff;border-radius:6px;padding:8px;width:100%;color:#c62828;margin-top:8px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;pointer-events:none;background:#1e1e1e;color:#fff;border-radius:8px;padding:10px 14px;display:flex;gap:14px;align-items:center;transition:.2s;z-index:100;box-shadow:0 6px 24px #0004;max-width:calc(100vw - 32px)}

.app.previewing .panel{display:none}

</style></head>

/* ---------- Script embarqué dans la page (filtres, bannière, fenêtres) ---------- */
function KFRuntime(){
  const D=window.KF_DATA,P=D.products,CATS=D.categories,doc=document;
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const missing='data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240"><rect width="300" height="240" fill="#f6f6f9"/><text x="150" y="125" fill="#77798b" font-family="Arial" font-size="13" text-anchor="middle">Photo indisponible</text></svg>');
  const known=v=>!!v&&v!=='À confirmer',metaOf=p=>[p.mat,p.sect].filter(known).join(' · ');
  window.kfSafe=img=>{img.onerror=null;img.src=missing};
  const sectors=[...new Set(P.map(p=>p.sect))].filter(known).sort((a,b)=>a.localeCompare(b,'fr'));
  const KF=window.KF={timers:[]};
  const byId=id=>doc.getElementById(id);
  let selected=null;
  const card=(p,i)=>`<button class="product" data-product="${i}"><img src="${p.img}" alt="${esc(p.alt)}" loading="lazy" width="300" height="300" onerror="kfSafe(this)"><div class="info"><span class="tag">${esc(p.typ)}</span><strong>${esc(p.name)}</strong><small>${[metaOf(p),p.kind].filter(Boolean).map(esc).join('<br>')}</small></div></button>`;
  function openProduct(i){const p=P[i];if(!p)return;selected=p;const im=byId('modalImg');im.onerror=()=>kfSafe(im);im.src=p.img;im.alt=p.alt;byId('modalType').textContent=p.typ;byId('modalName').textContent=p.name;byId('modalMeta').textContent=[known(p.mat)?'Matière : '+p.mat:'',known(p.sect)?'Secteur : '+p.sect:''].filter(Boolean).join(' · ');const s=byId('modalSource');s.hidden=!p.source;s.href=p.source||'#';s.textContent=(p.kind==='Réalisation'?'Voir la réalisation sur Kontfeel':'Voir la gamme sur Kontfeel')+' ↗';byId('productDialog').showModal()}
  function openQuote(p){const pd=byId('productDialog');if(pd.open)pd.close();byId('quoteForm').reset();byId('confirmation').classList.add('hide');if(p){byId('quoteType').value=p.typ;byId('project').value='Projet similaire à : '+p.name}byId('quoteDialog').showModal()}
  function initHero(el){
    const imgs=D.hero,ph=el.querySelector('.hero-photo');if(!ph||!imgs.length)return;
    const th=el.querySelector('.thumbs'),dots=el.querySelector('.dots');let i=0,timer=null,paused=false;
    if(th)th.innerHTML=imgs.map(x=>`<button type="button" aria-label="${esc(x.alt)}"><img src="${x.src}" alt=""></button>`).join('');
    if(dots)dots.innerHTML=imgs.map((x,j)=>`<button type="button" aria-label="Image ${j+1}"></button>`).join('');
    const groups=[th,dots].filter(Boolean);
    function go(n,user,anim){i=(n+imgs.length)%imgs.length;ph.src=imgs[i].src;ph.alt=imgs[i].alt;if(anim!==false){ph.classList.remove('fade');void ph.offsetWidth;ph.classList.add('fade')}groups.forEach(g=>[...g.children].forEach((b,j)=>{b.classList.toggle('selected',j===i);b.setAttribute('aria-pressed',String(j===i))}));if(user)restart()}
    groups.forEach(g=>[...g.children].forEach((b,j)=>b.onclick=()=>go(j,true)));
    const pv=el.querySelector('.arrow.prev'),nx=el.querySelector('.arrow.next');if(pv)pv.onclick=()=>go(i-1,true);if(nx)nx.onclick=()=>go(i+1,true);
    const auto=el.dataset.auto==='1'&&!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
    function restart(){clearInterval(timer);if(auto&&!paused){timer=setInterval(()=>go(i+1),4500);KF.timers.push(timer)}}
    el.onmouseenter=()=>{paused=true;clearInterval(timer)};el.onmouseleave=()=>{paused=false;restart()};
    el.addEventListener('focusin',()=>{paused=true;clearInterval(timer)});el.addEventListener('focusout',()=>{paused=false;restart()});
    let x0=null;el.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});el.addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>40)go(i+(dx<0?1:-1),true);x0=null});
    go(0,false,false);restart();
  }
  function initGallery(sec){
    const mode=sec.dataset.filter,withSect=sec.dataset.sectors==='1',per=+sec.dataset.per||12;
    const st={types:new Set(),sects:new Set(),q:'',limit:per};
    const F=sec.querySelector('.kf-filters'),G=sec.querySelector('.gallery'),S=sec.querySelector('.status'),M=sec.querySelector('.kf-more');
    const opt=v=>`<option value="${esc(v)}">${esc(v)}</option>`;
    const box=(g,v)=>`<label class="type-option"><input type="checkbox" data-g="${g}" value="${esc(v)}"><span>${esc(v)}</span></label>`;
    const pill=(g,v)=>`<button type="button" class="f-pill" data-g="${g}" data-v="${esc(v)}" aria-pressed="false">${esc(v)}</button>`;
    let h='';
    if(mode==='top')h=`<div class="filters${withSect?'':' one'}"><label>Typologie<select data-g="types"><option value="">Tous</option>${CATS.map(opt).join('')}</select></label>${withSect?`<label>Secteur<select data-g="sects"><option value="">Tous</option>${sectors.map(opt).join('')}</select></label>`:''}<button type="button" class="reset" data-reset>Réinitialiser</button></div>`;
    else if(mode==='left'||mode==='right')h=`<h3>Filtres</h3><div class="filters"><fieldset class="type-field"><legend>Type de PLV</legend><div class="type-options">${CATS.map(v=>box('types',v)).join('')}</div></fieldset>${withSect?`<fieldset class="type-field"><legend>Secteur d’activité</legend><div class="type-options sector-options">${sectors.map(v=>box('sects',v)).join('')}</div></fieldset>`:''}<button type="button" class="btn" data-reset>Tout voir</button></div>`;
    else if(mode==='pills')h=`<div class="filters pills" role="group" aria-label="Filtrer par type de PLV"><strong class="pill-title">Type de PLV</strong><div class="pill-options">${CATS.map(v=>pill('types',v)).join('')}</div><button type="button" class="reset" data-reset>Tout voir</button></div>${withSect?`<div class="filters pills" role="group" aria-label="Filtrer par secteur"><strong class="pill-title">Secteur</strong><div class="pill-options">${sectors.map(v=>pill('sects',v)).join('')}</div></div>`:''}`;
    if(F)F.innerHTML=h;
    const root=F||sec;
    root.querySelectorAll('select[data-g]').forEach(s=>s.onchange=()=>{st[s.dataset.g]=new Set(s.value?[s.value]:[]);st.limit=per;render()});
    root.querySelectorAll('input[data-g]').forEach(c=>c.onchange=()=>{const set=st[c.dataset.g];c.checked?set.add(c.value):set.delete(c.value);st.limit=per;render()});
    root.querySelectorAll('.f-pill').forEach(b=>b.onclick=()=>{const set=st[b.dataset.g],v=b.dataset.v;set.has(v)?set.delete(v):set.add(v);st.limit=per;render()});
    root.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>{st.types.clear();st.sects.clear();st.q='';st.limit=per;render()});
    if(M)M.onclick=()=>{st.limit+=per;render()};
    function render(){
      const q=norm(st.q.trim());
      const res=P.map((p,i)=>[p,i]).filter(([p])=>(!q||norm([p.name,p.typ,p.mat,p.sect].join(' ')).includes(q))&&(!st.types.size||st.types.has(p.typ))&&(!st.sects.size||st.sects.has(p.sect)));
      root.querySelectorAll('select[data-g]').forEach(s=>{const set=st[s.dataset.g];s.value=set.size?[...set][0]:''});
      root.querySelectorAll('input[data-g]').forEach(c=>c.checked=st[c.dataset.g].has(c.value));
      root.querySelectorAll('.f-pill').forEach(b=>b.setAttribute('aria-pressed',String(st[b.dataset.g].has(b.dataset.v))));
      if(S){const chips=[...(st.q?[['q',st.q]]:[]),...[...st.types].map(v=>['types',v]),...[...st.sects].map(v=>['sects',v])];
        S.innerHTML=`<strong>${res.length} réalisation${res.length>1?'s':''}</strong>`+chips.map(([k,v])=>`<button type="button" class="chip" data-k="${k}" data-v="${esc(v)}">${k==='q'?'Recherche : ':''}${esc(v)} ×</button>`).join('');
        S.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{if(c.dataset.k==='q')st.q='';else st[c.dataset.k].delete(c.dataset.v);st.limit=per;render()})}
      G.innerHTML=res.length?res.slice(0,st.limit).map(([p,i])=>card(p,i)).join(''):'<div class="empty">Aucune réalisation ne correspond à ces critères. Modifiez vos filtres.</div>';
      if(M)M.closest('.center').classList.toggle('hide',res.length<=st.limit);
      G.querySelectorAll('[data-product]').forEach(b=>b.onclick=()=>openProduct(+b.dataset.product));
      doc.querySelectorAll('.cat[data-cat]').forEach(b=>b.classList.toggle('on',st.types.has(b.dataset.cat)));
    }
    render();
    return{choose(c){st.types=new Set([c]);st.sects.clear();st.q='';st.limit=per;render();sec.scrollIntoView({behavior:'smooth'})},search(q){st.types.clear();st.sects.clear();st.q=q;st.limit=per;render();sec.scrollIntoView({behavior:'smooth'})}};
  }
  KF.init=function(){
    KF.timers.forEach(clearInterval);KF.timers=[];
    const qt=byId('quoteType');if(qt)qt.innerHTML='<option value="">À définir</option>'+CATS.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');
    const gals=[...doc.querySelectorAll('[data-kf=gallery]')].map(initGallery);
    doc.querySelectorAll('.cat[data-cat]').forEach(b=>b.onclick=()=>{if(gals[0])gals[0].choose(b.dataset.cat)});
    doc.querySelectorAll('.kf-search').forEach(f=>f.onsubmit=e=>{e.preventDefault();if(gals[0])gals[0].search(f.querySelector('input').value.trim())});
    doc.querySelectorAll('[data-kf=hero]').forEach(initHero);
    doc.querySelectorAll('.quote').forEach(b=>b.onclick=()=>openQuote());
    doc.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>openProduct(+b.dataset.case));

const GROUPS=['En-tête','Catalogue','Contenu','Conversion','Mise en page'];

/* ---------- État ---------- */
const B=(type,s={})=>({id:uid(),type,s,t:{}});
function preset(n){
 if(n===0)return[B('header'),B('hero',{variant:'minimal'}),B('texte'),B('footer')];
 const filt={1:'top',2:'left',3:'pills'}[n];
 return[B('announce'),B('header'),B('crumb'),B('hero'),B('benefits'),B('gammes'),B('galerie',{filter:filt,sectors:n!==3,cols:n===2?'5':'6'}),B('contenu'),B('secteurs'),B('etapes'),B('cas'),B('faq'),B('avis'),B('cta'),B('footer')];
}
const G0={accent:'#d3336c',corners:'round',font:'sans',width:'1250'};
let state={v:1,g:{...G0},blocks:preset(1)};
const ui={tab:'blocks',sel:null,view:'list',insertAt:null,preview:false};
const KEY='kontfeel-p4';
function valid(o){return o&&Array.isArray(o.blocks)&&o.blocks.every(b=>b&&DEFS[b.type])}
function load(){
 const m=location.hash.match(/^#l=(.+)$/);
 if(m){try{const o=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/')))));if(valid(o)){history.replaceState(null,'',location.pathname);return o}}catch(e){}}
 try{const o=JSON.parse(localStorage.getItem(KEY));if(valid(o))return o}catch(e){}
 return null;
}
function norm(o){o.g={...G0,...(o.g||{})};o.blocks.forEach(b=>{b.id=b.id||uid();b.s=b.s||{};b.t=b.t||{}});return o}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
let hist=[],hi=-1;
function commit(rerender=true){hist=hist.slice(0,hi+1);hist.push(JSON.stringify(state));if(hist.length>80)hist.shift();hi=hist.length-1;save();if(rerender)render();else updUndo()}
function undo(){if(hi>0){hi--;state=JSON.parse(hist[hi]);save();render()}}
function redo(){if(hi<hist.length-1){hi++;state=JSON.parse(hist[hi]);save();render()}}
const find=id=>state.blocks.find(b=>b.id===id);
const idx=id=>state.blocks.findIndex(b=>b.id===id);
const sv=b=>({...DEFS[b.type].d,...b.s});

/* ---------- Images : data URI -> blob (léger pour l'aperçu) ---------- */
const BLOB={};
for(const k in ASSETS){try{const[h,b64]=ASSETS[k].split(',');const mime=h.slice(5).split(';')[0];const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);BLOB[k]=URL.createObjectURL(new Blob([u],{type:mime}))}catch(e){BLOB[k]=ASSETS[k]}}
const dataFor=U=>({products:PRODUCTS.map(p=>({...p,img:p.img[0]==='@'?U(p.img.slice(1)):p.img})),categories:CATS.map(x=>x[0]),hero:HERO.map(h=>({src:U(h.k),alt:h.alt}))});

/* ---------- Rendu de la page ---------- */
function globalCSS(g){
 let css=`#kf-root{--pink:${g.accent};--pale:${tint(g.accent,.9)};--pinkd:${shade(g.accent,.18)}}#kf-root .wrap{max-width:${g.width}px}`;
 if(g.corners==='square')css+='#kf-root *:not(.arrow):not(.dots>button):not(.f-pill):not(.chip):not(.cat.pill):not(.cat.pill img){border-radius:2px!important}';
 if(g.font==='serif')css+='#kf-root h1,#kf-root h2,#kf-root h3{font-family:Georgia,"Times New Roman",serif;letter-spacing:-.3px;font-weight:600}';
 if(g.font==='bold')css+='#kf-root h1,#kf-root h2{font-weight:800;text-transform:uppercase;letter-spacing:-.4px}';
 return css;
}
function pageHTML(c){
 const seen={};c.once=id=>seen[id]?'':(seen[id]=1,` id="${id}"`);
 const hb=state.blocks.find(b=>b.type==='header'&&!b.hidden);c.sticky=!!(hb&&sv(hb).sticky);
 let out=c.edit?'<div class="kb-ins first"><button type="button" data-ins="0">+ Ajouter un bloc ici</button></div>':'';
 state.blocks.forEach((b,i)=>{
  const d=DEFS[b.type],s=sv(b);
  const T=(k,def,tag='span',attrs='')=>`<${tag}${attrs} data-edit="${k}">${esc(b.t[k]!=null?b.t[k]:def)}</${tag}>`;
  const stick=b.type==='header'&&s.sticky&&!b.hidden?' sticky':'';
  if(!c.edit){if(!b.hidden)out+=`<div class="kb${stick}">${d.r(s,T,c)}</div>`;return}
  const inner=b.hidden?`<div class="kb-hidden">Bloc masqué : ${esc(d.name)} — invisible sur la page publiée</div>`:d.r(s,T,c);
  out+=`<div class="kb${stick}${b.id===ui.sel?' sel':''}" data-id="${b.id}"><div class="kb-bar"><span>${esc(d.name)}</span><button type="button" data-act="up" title="Monter">↑</button><button type="button" data-act="down" title="Descendre">↓</button><button type="button" data-act="set" title="Réglages">⚙</button><button type="button" data-act="dup" title="Dupliquer">⧉</button><button type="button" data-act="del" title="Supprimer">✕</button></div>${inner}</div><div class="kb-ins${i===state.blocks.length-1?' last':''}"><button type="button" data-ins="${i+1}">+ Ajouter un bloc ici</button></div>`;
 });
 if(c.edit&&!state.blocks.length)out='<div class="kb-ins last"><button type="button" data-ins="0">+ Ajouter un premier bloc</button></div>';
 return out+DIALOGS;
}
let fwin,fdoc;
const CE=(()=>{const d=document.createElement('div');d.contentEditable='plaintext-only';return d.contentEditable==='plaintext-only'?'plaintext-only':'true'})();
function render(){
 const c={U:k=>BLOB[k],edit:!ui.preview};
 const root=fdoc.getElementById('kf-root'),y=fwin.scrollY;
 root.innerHTML=pageHTML(c);
 fdoc.getElementById('gcss').textContent=globalCSS(state.g);
 fdoc.documentElement.classList.toggle('kb-edit',c.edit);
 fwin.KF.init();
 if(c.edit)fdoc.querySelectorAll('[data-edit]').forEach(el=>{el.setAttribute('contenteditable',CE);el.spellcheck=false});
 fwin.scrollTo(0,y);
 renderPanel();updUndo();
}
function bootFrame(){
 const fr=$('#canvas');fwin=fr.contentWindow;fdoc=fr.contentDocument;
 fdoc.open();fdoc.write('<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>'+BASE_CSS+EXTRA_CSS+KB_CSS+'</style><style id="gcss"></style></head><body><div id="kf-root"></div></body></html>');fdoc.close();
 const sc=fdoc.createElement('script');sc.textContent='window.KF_DATA='+safeJSON(dataFor(k=>BLOB[k]))+';('+KFRuntime.toString()+')();';fdoc.body.appendChild(sc);
 fdoc.addEventListener('click',e=>{
  const act=e.target.closest('[data-act]');if(act){e.preventDefault();e.stopPropagation();blockAct(act.dataset.act,act.closest('.kb').dataset.id);return}
  const ins=e.target.closest('[data-ins]');if(ins){e.preventDefault();e.stopPropagation();ui.insertAt=+ins.dataset.ins;ui.tab='add';openPanel();renderPanel();return}
  if(ui.preview)return;
  if(e.target.closest('[data-edit]')){e.preventDefault();e.stopPropagation();return}
  const a=e.target.closest('a[href]');if(a&&!a.getAttribute('href').startsWith('#')){e.preventDefault();e.stopPropagation();toast('Les liens sont désactivés en mode édition. Passez en Aperçu pour les tester.')}
 },true);
 fdoc.addEventListener('pointerdown',e=>{if(ui.preview)return;const kb=e.target.closest('.kb[data-id]');if(kb&&!e.target.closest('.kb-bar,.kb-ins'))select(kb.dataset.id,false)},true);
 let tmr;fdoc.addEventListener('input',e=>{const el=e.target.closest&&e.target.closest('[data-edit]');if(!el)return;const b=find(el.closest('.kb').dataset.id);if(!b)return;b.t[el.dataset.edit]=el.textContent;save();clearTimeout(tmr);tmr=setTimeout(()=>{commit(false);if(ui.view==='settings')renderPanel()},600)});
 fdoc.addEventListener('keydown',e=>{const el=e.target.closest&&e.target.closest('[data-edit]');if(el&&e.key==='Enter'){e.preventDefault();el.blur()}if(!el)keys(e)});
 fdoc.addEventListener('paste',e=>{const el=e.target.closest&&e.target.closest('[data-edit]');if(el&&CE!=='plaintext-only'){e.preventDefault();fdoc.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text/plain'))}});
}

/* ---------- Actions ---------- */
function flash(id){const el=fdoc.querySelector(`.kb[data-id="${id}"]`);if(el){el.scrollIntoView({behavior:'smooth',block:'start'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}}
function select(id,scroll){ui.sel=id;ui.view='settings';ui.tab='blocks';fdoc.querySelectorAll('.kb.sel').forEach(x=>x.classList.remove('sel'));const el=fdoc.querySelector(`.kb[data-id="${id}"]`);if(el)el.classList.add('sel');renderPanel();if(scroll)flash(id)}
function move(id,d){const i=idx(id),j=i+d;if(i<0||j<0||j>=state.blocks.length)return;const[b]=state.blocks.splice(i,1);state.blocks.splice(j,0,b);commit();flash(id)}
function dup(id){const i=idx(id);const b=JSON.parse(JSON.stringify(state.blocks[i]));b.id=uid();state.blocks.splice(i+1,0,b);ui.sel=b.id;commit();flash(b.id)}
function del(id){const i=idx(id),name=DEFS[state.blocks[i].type].name;state.blocks.splice(i,1);if(ui.sel===id){ui.sel=null;ui.view='list'}commit();toast(`Bloc « ${name} » supprimé.`,true)}
function vis(id){const b=find(id);b.hidden=!b.hidden;commit()}
function addBlock(type){const b=B(type);let at=ui.insertAt!=null?ui.insertAt:ui.sel&&idx(ui.sel)>=0?idx(ui.sel)+1:state.blocks.length;if(ui.insertAt==null&&type!=='footer'){const f=state.blocks.findIndex(x=>x.type==='footer');if(!ui.sel&&f>=0)at=f}state.blocks.splice(at,0,b);ui.insertAt=null;ui.sel=b.id;ui.view='settings';ui.tab='blocks';commit();setTimeout(()=>flash(b.id),60)}
function blockAct(a,id){if(a==='up')move(id,-1);else if(a==='down')move(id,1);else if(a==='dup')dup(id);else if(a==='del')del(id);else if(a==='set'){select(id,false);openPanel()}}

/* ---------- Panneau ---------- */
const IC={grip:'<svg width="10" height="16" viewBox="0 0 10 16" fill="currentColor"><circle cx="2.5" cy="3" r="1.4"/><circle cx="7.5" cy="3" r="1.4"/><circle cx="2.5" cy="8" r="1.4"/><circle cx="7.5" cy="8" r="1.4"/><circle cx="2.5" cy="13" r="1.4"/><circle cx="7.5" cy="13" r="1.4"/></svg>',
 eye:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
 eyeoff:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3l18 18M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7a10 10 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>',
 chev:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>'};
function ctl(o,v){
 if(o.type==='tog')return`<label class="ctl tog"><span>${o.l}</span><input type="checkbox" data-k="${o.k}"${v?' checked':''}><i></i></label>`;
 if(o.type==='img')return`<div class="ctl"><div class="cl">${o.l}</div><div class="imgs">${IMGCHOICES.map(k=>`<button type="button" class="imgpick${v===k?' on':''}" data-k="${o.k}" data-v="${k}" aria-pressed="${v===k}"><img src="${BLOB[k]}" alt=""></button>`).join('')}</div></div>`;
 const tiles=o.type==='tiles';
 return`<div class="ctl"><div class="cl">${o.l}</div><div class="${tiles?'tiles':'seg2'}">${o.ch.map(([val,l,sk])=>`<button type="button" class="${tiles?'tile':''}${v===val?' on':''}" data-k="${o.k}" data-v="${val}" aria-pressed="${v===val}">${tiles?SK[sk]||'':''}<span>${l}</span></button>`).join('')}</div>${o.help?`<p class="help">${o.help}</p>`:''}</div>`;
}
function listHTML(){
 return`<p class="hint">Glissez les blocs pour changer leur ordre. Cliquez sur un bloc pour choisir son style, et directement sur un texte de la page pour le modifier.</p><ol class="blist">${state.blocks.map(b=>{const d=DEFS[b.type],s=sv(b);return`<li class="brow${b.id===ui.sel?' sel':''}${b.hidden?' off':''}" draggable="true" data-id="${b.id}"><span class="grip" title="Glisser pour déplacer">${IC.grip}</span><span class="bico">${d.icon}</span><div class="bname" data-a="open">${esc(d.name)}<small>${esc(d.sum?d.sum(s):d.desc)}</small></div><button type="button" class="ib" data-a="vis" title="${b.hidden?'Afficher le bloc':'Masquer le bloc'}" aria-label="${b.hidden?'Afficher':'Masquer'} ${esc(d.name)}">${b.hidden?IC.eyeoff:IC.eye}</button><button type="button" class="ib" data-a="open" aria-label="Réglages ${esc(d.name)}">${IC.chev}</button></li>`}).join('')}</ol><button type="button" class="addbtn" data-a="gotoadd">+ Ajouter un bloc</button>`;
}
function settingsHTML(b){
 const d=DEFS[b.type],s=sv(b);
 let h=`<button type="button" class="back" data-a="back">← Tous les blocs</button><div class="shead"><span class="bico lg">${d.icon}</span><div><h3>${esc(d.name)}</h3><p>${esc(d.desc)}</p></div></div>`;
 d.o.filter(o=>!o.when||o.when(s)).forEach(o=>h+=ctl(o,s[o.k]));
 if(!d.o.length)h+='<p class="hint">Ce bloc n’a pas de réglage de style. Cliquez sur son texte dans la page pour le modifier.</p>';
 if(Object.keys(b.t).length)h+=`<button type="button" class="linkbtn" data-a="resettxt">Rétablir les textes d’origine de ce bloc</button>`;
 return h+`<div class="sactions"><button type="button" data-a="up">↑ Monter</button><button type="button" data-a="down">↓ Descendre</button><button type="button" data-a="dup">Dupliquer</button><button type="button" data-a="vis">${b.hidden?'Afficher':'Masquer'}</button><button type="button" class="danger" data-a="del">Supprimer ce bloc</button></div>`;
}
function addHTML(){
 let h=ui.insertAt!=null?`<div class="insnote">Insertion en position ${ui.insertAt+1}<button type="button" data-a="cancelins">Annuler</button></div>`:`<p class="hint">Le bloc sera ajouté ${ui.sel?'après le bloc sélectionné':'avant le pied de page'}. Vous pouvez aussi survoler la page et cliquer sur « + Ajouter un bloc ici ».</p>`;
 GROUPS.forEach(g=>{h+=`<div class="grp">${g}</div><div class="addgrid">`+Object.entries(DEFS).filter(([,d])=>d.group===g).map(([k,d])=>`<button type="button" class="additem" data-a="add" data-type="${k}"><span class="bico lg">${d.icon}</span><span><b>${esc(d.name)}</b><small>${esc(d.desc)}</small></span></button>`).join('')+'</div>'});
 return h;
}
const ACCENTS=[['#d3336c','Rose Kontfeel'],['#2f5bea','Bleu'],['#1f8a5b','Vert'],['#e0641b','Orange'],['#6b3fd4','Violet'],['#19192d','Encre']];
function styleHTML(){
 const g=state.g,sg=(k,ch)=>`<div class="seg2">${ch.map(([v,l])=>`<button type="button" class="${g[k]===v?'on':''}" data-g="${k}" data-gv="${v}" aria-pressed="${g[k]===v}">${l}</button>`).join('')}</div>`;
 return`<div class="grp">Partir d’un modèle</div><div class="presets"><button type="button" class="preset" data-a="preset" data-n="1"><b>Prototype 1</b><small>Filtres en menus déroulants en haut</small></button><button type="button" class="preset" data-a="preset" data-n="2"><b>Prototype 2</b><small>Filtres visibles dans une colonne à gauche</small></button><button type="button" class="preset" data-a="preset" data-n="3"><b>Prototype 3</b><small>Types de PLV en pastilles en haut</small></button><button type="button" class="preset" data-a="preset" data-n="0"><b>Page presque vide</b><small>En-tête, bannière, texte et pied de page</small></button></div>
 <div class="grp">Couleur principale</div><div class="swatches">${ACCENTS.map(([v,l])=>`<button type="button" class="sw${g.accent.toLowerCase()===v?' on':''}" style="background:${v}" data-g="accent" data-gv="${v}" title="${l}" aria-label="${l}"></button>`).join('')}<input type="color" id="accentPick" value="${g.accent}" title="Couleur personnalisée" aria-label="Couleur personnalisée"></div>
 <div class="grp">Coins</div>${sg('corners',[['round','Arrondis'],['square','Carrés']])}
 <div class="grp">Titres</div>${sg('font',[['sans','Actuels'],['serif','Élégants (serif)'],['bold','Gras majuscules']])}
 <div class="grp">Largeur du contenu</div>${sg('width',[['1100','Étroite'],['1250','Normale'],['1440','Large']])}
 <div class="grp">Remise à zéro</div><button type="button" class="danger-link" data-a="resetall">Tout réinitialiser (modèle Prototype 1)</button>`;
}
function renderPanel(){
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===ui.tab));
 const P=$('#pbody'),b=ui.sel&&find(ui.sel);
 P.innerHTML=ui.tab==='add'?addHTML():ui.tab==='style'?styleHTML():(ui.view==='settings'&&b)?settingsHTML(b):listHTML();
}
const pb=$('#pbody');
pb.addEventListener('click',e=>{
 const kv=e.target.closest('[data-k][data-v]');if(kv){const b=find(ui.sel);if(b){b.s={...b.s,[kv.dataset.k]:kv.dataset.v};commit()}return}
 const gv=e.target.closest('[data-g][data-gv]');if(gv){state.g[gv.dataset.g]=gv.dataset.gv;commit();return}
 const a=e.target.closest('[data-a]');if(!a)return;const row=a.closest('[data-id]'),id=row?row.dataset.id:ui.sel;
 switch(a.dataset.a){
  case'open':select(id,true);closePanelM();break;
  case'vis':vis(id);break;
  case'back':ui.view='list';renderPanel();break;
  case'gotoadd':ui.tab='add';ui.insertAt=null;renderPanel();break;
  case'cancelins':ui.insertAt=null;renderPanel();break;
  case'up':move(id,-1);break;case'down':move(id,1);break;case'dup':dup(id);break;case'del':del(id);break;
  case'resettxt':find(id).t={};commit();break;
  case'add':addBlock(a.dataset.type);closePanelM();break;
  case'preset':if(confirm('Remplacer la mise en page actuelle par ce modèle ? (Annuler reste possible avec ↶)')){state.blocks=preset(+a.dataset.n);ui.sel=null;ui.view='list';ui.tab='blocks';commit();fwin.scrollTo(0,0)}break;
  case'resetall':if(confirm('Tout réinitialiser ? Les textes modifiés et les styles seront perdus (↶ permet d’annuler).')){state={v:1,g:{...G0},blocks:preset(1)};ui.sel=null;ui.view='list';ui.tab='blocks';commit();fwin.scrollTo(0,0)}break;
 }
});
pb.addEventListener('change',e=>{const t=e.target;if(t.matches('input[type=checkbox][data-k]')){const b=find(ui.sel);if(b){b.s={...b.s,[t.dataset.k]:t.checked};commit()}}if(t.id==='accentPick'){state.g.accent=t.value;commit()}});
pb.addEventListener('input',e=>{if(e.target.id==='accentPick')fdoc.getElementById('gcss').textContent=globalCSS({...state.g,accent:e.target.value})});
let dragId=null;
pb.addEventListener('dragstart',e=>{const li=e.target.closest('.brow');if(!li)return;dragId=li.dataset.id;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragId)}catch(_){}li.classList.add('dragging')});
const clearDrop=()=>pb.querySelectorAll('.dropbefore,.dropafter').forEach(x=>x.classList.remove('dropbefore','dropafter'));
pb.addEventListener('dragover',e=>{const li=e.target.closest('.brow');if(!li||!dragId)return;e.preventDefault();const r=li.getBoundingClientRect();clearDrop();li.classList.add(e.clientY>r.top+r.height/2?'dropafter':'dropbefore')});
pb.addEventListener('drop',e=>{const li=e.target.closest('.brow');if(!li||!dragId)return;e.preventDefault();const after=li.classList.contains('dropafter'),from=idx(dragId);const[b]=state.blocks.splice(from,1);let to=idx(li.dataset.id);if(to<0){state.blocks.splice(from,0,b);return}state.blocks.splice(after?to+1:to,0,b);dragId=null;commit();flash(b.id)});
pb.addEventListener('dragend',()=>{dragId=null;clearDrop();pb.querySelectorAll('.dragging').forEach(x=>x.classList.remove('dragging'))});
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ui.tab=b.dataset.tab;if(ui.tab==='blocks')ui.view=ui.view;renderPanel()});

/* ---------- Barre d'outils ---------- */
const app=$('#app');
function openPanel(){app.classList.add('panel-open')}
function closePanelM(){if(matchMedia('(max-width:900px)').matches)app.classList.remove('panel-open')}
$('#openPanel').onclick=openPanel;$('#closePanel').onclick=()=>app.classList.remove('panel-open');
document.querySelectorAll('#devices button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#devices button').forEach(x=>x.classList.toggle('on',x===b));$('#canvas').style.width=b.dataset.w});
function updUndo(){$('#undo').disabled=hi<=0;$('#redo').disabled=hi>=hist.length-1}
$('#undo').onclick=undo;$('#redo').onclick=redo;
$('#previewBtn').onclick=()=>{ui.preview=!ui.preview;app.classList.toggle('previewing',ui.preview);$('#previewBtn').classList.toggle('on',ui.preview);$('#previewBtn').innerHTML=ui.preview?'✎ <span class="lbl">Modifier</span>':'◉ <span class="lbl">Aperçu</span>';render()};
function keys(e){const m=e.metaKey||e.ctrlKey;if(m&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}else if(m&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}}
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea'))return;keys(e)});
let tt;function toast(msg,withUndo){$('#toastMsg').textContent=msg;$('#toastUndo').hidden=!withUndo;$('#toast').classList.add('show');clearTimeout(tt);tt=setTimeout(()=>$('#toast').classList.remove('show'),4500)}
$('#toastUndo').onclick=()=>{undo();$('#toast').classList.remove('show')};
$('#shareBtn').onclick=async()=>{
 const enc=btoa(unescape(encodeURIComponent(JSON.stringify(state)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
 const url=location.href.split('#')[0]+'#l='+enc;
 try{await navigator.clipboard.writeText(url);toast('Lien copié : il ouvre exactement cette mise en page.')}catch(e){prompt('Copiez ce lien :',url)}
};
$('#exportBtn').onclick=()=>{
 const c={U:k=>ASSETS[k],edit:false};
 const body=pageHTML(c).replace(/ data-edit="[^"]*"/g,'');
 const html=`<!doctype html>\n<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Présentoir de comptoir sur mesure | Fabricant PLV Kontfeel</title><meta name="description" content="Fabricant de présentoirs de comptoir en carton, bois, métal et plastique. Découvrez nos solutions de PLV personnalisées et demandez une étude."><style>${BASE_CSS}${EXTRA_CSS}${globalCSS(state.g)}</style></head><body><div id="kf-root">${body}</div><script>window.KF_DATA=${safeJSON(dataFor(c.U))};(${KFRuntime.toString()})();KF.init();<\/script></body></html>`;
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='kontfeel-page-personnalisee.html';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
 toast('Page téléchargée : un fichier HTML autonome, sans le constructeur.');
};

/* ---------- Démarrage ---------- */
const loaded=load();if(loaded)state=norm(loaded);
bootFrame();commit();
</script>
</body></html>
