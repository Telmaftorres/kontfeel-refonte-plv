<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Maquette | Refonte du site internet Kontfeel</title>
<style>
:root{--ink:#19192d;--muted:#6f7085;--pink:#d3336c;--pale:#fbeef3;--line:#e9e9ef}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.4 'Avenir Next',Arial,sans-serif;color:var(--ink);background:#fff;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:3px solid #18b7d8;outline-offset:2px}
.barre{flex:0 0 auto;display:flex;align-items:center;gap:16px;padding:8px 16px;border-top:4px solid var(--ink);border-bottom:1px solid var(--line);background:#fff;min-height:54px}
.retour{display:inline-flex;align-items:center;gap:6px;font-weight:650;color:var(--pink);background:var(--pale);border-radius:8px;padding:8px 13px;white-space:nowrap}
.retour:hover{filter:brightness(.97)}
.logo{height:26px;width:auto;display:block}
.titre{flex:1;min-width:0;display:flex;flex-direction:column}
.titre strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titre small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.versions{display:flex;gap:6px}
.versions a{border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-weight:600;font-size:13px;white-space:nowrap}
.versions a[aria-current]{border-color:var(--pink);color:var(--pink)}
.versions a:hover{border-color:var(--pink)}
.plein{font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
iframe{flex:1 1 auto;width:100%;border:0;display:block}
.vide{padding:60px 20px;text-align:center}
@media(max-width:820px){.logo,.titre small{display:none}.versions{display:none}}
@media(max-width:480px){.barre{gap:10px;padding:8px 12px}.plein{display:none}}
</style>
</head>
<body>
<div class="barre">
  <a class="retour" href="./">← Toutes les maquettes</a>
  <img class="logo" src="assets/marque/logo-kontfeel.jpg" alt="Kontfeel" width="131" height="26">
  <div class="titre"><strong id="titre">Maquette</strong><small id="famille"></small></div>
  <nav class="versions" id="versions" aria-label="Autres versions de la famille"></nav>
  <a class="plein" id="plein" href="./">Plein écran ↗</a>
</div>
<script src="maquettes.js"></script>
<script>
(function(){
  var id=new URLSearchParams(location.search).get('m'),famille=null,maquette=null;
  KONTFEEL_FAMILLES.forEach(function(f){f.maquettes.forEach(function(m){if(m.id===id){famille=f;maquette=m;}});});
  if(!maquette){
    document.getElementById('titre').textContent='Maquette introuvable';
    document.getElementById('plein').remove();
    var p=document.createElement('p');p.className='vide';
    p.innerHTML='Cette maquette n’existe pas. <a href="./" style="color:var(--pink);font-weight:650">Revenir à la liste des maquettes</a>';
    document.body.appendChild(p);return;
  }
  document.title=maquette.titre+' | Refonte du site internet Kontfeel';
  document.getElementById('titre').textContent=maquette.titre;
  document.getElementById('famille').textContent=famille.titre;
  document.getElementById('plein').href=maquette.fichier;
  if(famille.maquettes.length>1){
    var nav=document.getElementById('versions');
    famille.maquettes.slice().sort(function(a,b){return a.titre.localeCompare(b.titre,'fr',{numeric:true});}).forEach(function(m){
      var a=document.createElement('a');a.href='voir.html?m='+encodeURIComponent(m.id);a.textContent=m.titre.split(' — ')[0];a.title=m.titre;
      if(m.id===maquette.id)a.setAttribute('aria-current','page');
      nav.appendChild(a);
    });
  }
  var fr=document.createElement('iframe');fr.src=maquette.fichier;fr.title=maquette.titre;
  /* Les sites externes (kontfeel.fr notamment) refusent l'affichage en cadre :
     leurs liens s'ouvrent dans l'onglet entier. La maquette elle-même n'est pas modifiée. */
  fr.addEventListener('load',function(){
    try{
      fr.contentDocument.addEventListener('click',function(e){
        var a=e.target.closest&&e.target.closest('a[href]');
        if(a&&a.origin&&a.origin!==location.origin&&!/^(mailto|tel):/.test(a.protocol)&&!a.target){a.target='_top';}
      },true);
    }catch(err){}
  });
  document.body.appendChild(fr);
})();
</script>
</body>
</html>
